[project]
name = "oracle-reconciliation-api"
version = "4.0.0"
description = "Professional enterprise API for Oracle ERP Cloud reconciliation matching."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "Levenshtein>=0.25.0",
    "defusedxml>=0.7.1",
    "slowapi>=0.1.9",
    "cachetools>=6.2.6",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
    "taskipy>=1.14.1",
    "vulture>=2.16",
    "bandit>=1.7.9",
    "mypy>=1.11.1",
    "pip-audit>=2.7.3",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatting)
]

[tool.coverage.run]
branch = false
source = ["src", "api"]

[tool.coverage.report]
# The floor is set just below what the suite genuinely achieves (100.00% on the pinned
# toolchain) rather than at a round aspirational number, so it fails on a real coverage
# regression and not on a platform difference. Raise it in the same commit that adds the
# tests that earn it, never on its own. tests/test_docs.py holds README.md and
# CONTRIBUTING.md to the measured value quoted here, so update all three together.
fail_under = 98
# Without this the floor is compared against a total rounded to whole percent, so 99.71%
# compares as 100% and a fail-under of 99.99 would silently pass. coverage.py compares the
# rounded display value, not the real one.
precision = 2
# Name the files that drag the number down, so a missed branch is a to-do rather than a
# mystery. The whole point of a floor is that it points at something.
skip_covered = false
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vulture]
# Assessed entry by entry: every name below is only ever reached through a framework
# hook, so vulture cannot find a static reference to it.
#   FastAPI route/exception handlers, and handler parameters:
#     root, health_check, readiness_check, reconcile_data_batch, global_exception_handler,
#     request
#   Pydantic internals resolved by the model metaclass:
#     cls, model_config, validate_oracle_url, sanitize_strings, sanitize_floats,
#     _set_invoice_count
#   Pydantic fields that exist purely to serialise the request/response contract and
#   are never read or written in application code:
#     line_id, description, confidence_score, fusion_currency, fusion_customer_name,
#     fusion_customer_number, fusion_receipt_status_code, match_phase
# Removed from the previous list: `mock_*` (no `mock_*` name is defined anywhere) and
# `add_warning` (genuinely unreachable; the method has been deleted).
#
# Re-audited at --min-confidence 60 after adding the process_reconciliation_batch tests.
# That pass reports ten more names and none of them is dead code, so none were removed and
# none were added to this list:
#   - customer_invoice_number, store_no, match_rule, warnings, header_id, confidence_label,
#     meta_data, meta_extra are the same category as the Pydantic contract fields above --
#     they exist to serialise the request/response schema and are not read in application
#     code. Deleting them would be a breaking API change, not a dead-code fix.
#   - clear_bip_cache is a pytest autouse fixture, reached through the framework like the
#     FastAPI handlers above rather than by name.
ignore_names = [
    "cls",
    "confidence_score",
    "description",
    "fusion_currency",
    "fusion_customer_name",
    "fusion_customer_number",
    "fusion_receipt_status_code",
    "global_exception_handler",
    "health_check",
    "line_id",
    "match_phase",
    "model_config",
    "readiness_check",
    "reconcile_data_batch",
    "request",
    "root",
    "sanitize_floats",
    "sanitize_strings",
    "validate_oracle_url",
    "_set_invoice_count",
]

[tool.taskipy.tasks]
start = "uvicorn src.main:app --reload --host 127.0.0.1 --port 8000"
lint = "ruff check src/ tests/ api/"
types = "mypy src/ api/"
security = "bandit -r src/ api/ -q"
deadcode = "vulture src/ tests/ api/ --min-confidence 80"
test = "pytest --cov=src --cov=api --cov-report=term-missing --cov-fail-under=98"
# Needs network access to the advisory database, so it is deliberately NOT part of
# check_all: a local gate that cannot run offline is a gate people learn to skip.
# The CI dependency-audit job is the gate; this is the same command for local use.
audit = "pip-audit --strict --requirement requirements.txt"
check_all = "task lint && task types && task security && task deadcode && task test"

[tool.mypy]
# pydantic.mypy teaches mypy about the __init__/__get_validators__ plugins the v2 metaclass
# injects, without which every model attribute reads as Any and the gate catches nothing.
plugins = ["pydantic.mypy"]
# Pinned to the floor of requires-python, not to whatever interpreter happens to be running
# the gate, so a 3.13 dev box does not silently accept 3.14-only syntax that a 3.12 runner
# would reject. `files` makes a bare `mypy` check the same tree the task checks.
python_version = "3.12"
files = ["src", "api"]
# Deliberately not `strict`. These are the checks that are worth the noise here; `strict`
# would additionally forbid Any returns and untyped decorators, and the framework types this
# code sits on (FastAPI handlers, Pydantic models) hand out Any at every seam, so turning it
# on would buy a wall of `# type: ignore` rather than a wall of safety. `disallow_untyped_defs`
# is the one that bit, and it found three genuinely unannotated functions the first time it
# ran; they are annotated now, so a new one is an oversight rather than a house style.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true

[tool.bandit]
skips = ["B101"]
