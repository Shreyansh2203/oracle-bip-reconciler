[project]
name = "oracle-reconciliation-api"
version = "4.0.0"
description = "Professional enterprise API for Oracle ERP Cloud reconciliation matching."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
    "Levenshtein>=0.25.0",
    "defusedxml>=0.7.1",
    "slowapi>=0.1.9",
    "cachetools>=6.2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
    "taskipy>=1.14.1",
    "vulture>=2.16",
    "bandit>=1.7.9",
    "mypy>=1.11.1",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatting)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vulture]
ignore_names = ["cls", "mock_*", "request"]

[tool.taskipy.tasks]
start = "uvicorn src.main:app --reload --host 127.0.0.1 --port 8000"
lint = "ruff check src/ tests/"
deadcode = "vulture src/ tests/ --min-confidence 80"
test = "pytest"
check_all = "task lint && task deadcode && task test"
