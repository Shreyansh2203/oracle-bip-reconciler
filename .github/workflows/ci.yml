name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      
    - name: Install dependencies
      run: |
        uv sync --dev
        
    - name: Lint with Ruff
      run: |
        uv run ruff check src/ api/ tests/
        
    - name: Run Tests
      env:
        ORACLE_URL: "http://localhost:8080"
        ORACLE_USER: "test"
        ORACLE_PASS: "test"
      run: |
        uv run pytest
