name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ORACLE_URL: "http://localhost:8080"
      ORACLE_USER: "test"
      ORACLE_PASS: "test"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync --frozen --dev

    - name: Lint, typecheck, security scan, dead code, tests
      run: uv run task check_all
