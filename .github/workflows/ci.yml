name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install dependencies
      run: |
        $HOME/.cargo/bin/uv pip install --system -r requirements.txt
        $HOME/.cargo/bin/uv pip install --system pytest pytest-asyncio httpx ruff
        
    - name: Lint with Ruff
      run: |
        $HOME/.cargo/bin/ruff check .
        
    - name: Run Tests
      run: |
        $HOME/.cargo/bin/uv run pytest
